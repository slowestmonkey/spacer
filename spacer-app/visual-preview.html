<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spacer - 16-bit Pixel Art Preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }

    body {
      background: #000011;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .game-container {
      width: 320px;
      height: 568px;
      background: #000011;
      position: relative;
      overflow: hidden;
      border: 4px solid #00aaaa;
    }

    /* Stars */
    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      animation: scroll 8s linear infinite;
    }

    @keyframes scroll {
      0% { transform: translateY(0); }
      100% { transform: translateY(200px); }
    }

    .star {
      position: absolute;
      background: #ffffff;
    }

    .star.dim { background: #888899; }
    .star.yellow { background: #ffff00; }
    .star.cyan { background: #00ffff; }
    .star.pink { background: #ff00ff; }

    .star.twinkle {
      animation: twinkle 0.8s steps(2) infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    /* Earth */
    .earth {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 80px;
      display: flex;
      flex-direction: column;
    }

    .earth-row {
      display: flex;
      flex: 1;
    }

    .earth-pixel {
      flex: 1;
    }

    /* Ship container */
    .ship-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      animation: bob 3s ease-in-out infinite;
    }

    @keyframes bob {
      0%, 100% { transform: translate(-50%, -50%) translateY(0); }
      50% { transform: translate(-50%, -50%) translateY(-8px); }
    }

    /* Ship - 16x24 pixel grid */
    .ship {
      display: grid;
      grid-template-columns: repeat(16, 5px);
      grid-template-rows: repeat(24, 5px);
    }

    .pixel {
      width: 5px;
      height: 5px;
    }

    /* Flame animation */
    .flame-container {
      position: absolute;
      bottom: -15px;
      left: 50%;
      transform: translateX(-50%);
      display: grid;
      grid-template-columns: repeat(16, 5px);
      grid-template-rows: repeat(3, 5px);
    }

    .flame-container .pixel {
      animation: flame 0.4s steps(4) infinite;
    }

    @keyframes flame {
      0%, 100% { opacity: 1; }
      25% { opacity: 0.8; }
      50% { opacity: 1; }
      75% { opacity: 0.9; }
    }

    /* UI Elements */
    .ui-box {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #00aaaa;
      padding: 6px 8px;
    }

    .header {
      position: absolute;
      top: 16px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
    }

    .fuel-label {
      font-size: 8px;
      color: #888888;
      letter-spacing: 1px;
    }

    .fuel-value {
      font-size: 14px;
      color: #00aaaa;
      font-weight: bold;
    }

    .fuel-bar {
      display: flex;
      gap: 2px;
      margin-top: 4px;
    }

    .fuel-segment {
      width: 10px;
      height: 6px;
      background: #444444;
    }

    .fuel-segment.filled {
      background: #00aaaa;
    }

    .destination {
      position: absolute;
      top: 70px;
      left: 0;
      right: 0;
      text-align: center;
    }

    .destination-label {
      font-size: 8px;
      color: #00aaaa;
      letter-spacing: 2px;
    }

    .destination-name {
      font-size: 16px;
      color: #ffffff;
      font-weight: bold;
      margin-top: 2px;
    }

    .state-badge {
      position: absolute;
      bottom: 140px;
      left: 50%;
      transform: translateX(-50%);
    }

    .state-badge .ui-box {
      border-color: #00ff00;
    }

    .state-text {
      font-size: 12px;
      color: #00ff00;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .footer {
      position: absolute;
      bottom: 16px;
      left: 12px;
      right: 12px;
    }

    .stats {
      margin-bottom: 8px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      padding: 2px 0;
    }

    .stat-label {
      font-size: 8px;
      color: #888888;
    }

    .stat-value {
      font-size: 10px;
      color: #ffffff;
      font-weight: bold;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .btn {
      background: rgba(0, 0, 0, 0.8);
      border: 2px solid #00aaaa;
      padding: 6px 10px;
      font-size: 8px;
      color: #00aaaa;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      cursor: pointer;
    }

    .btn:hover {
      background: #00aaaa;
      color: #000000;
    }

    .btn.red { border-color: #cc0000; color: #cc0000; }
    .btn.green { border-color: #00aa00; color: #00aa00; }
    .btn.yellow { border-color: #ffff00; color: #ffff00; background: #444444; }

    /* Color definitions */
    .c-trans { background: transparent; }
    .c-white { background: #ffffff; }
    .c-yellow { background: #ffff00; }
    .c-brightyellow { background: #ffff88; }
    .c-orange { background: #ff8800; }
    .c-darkorange { background: #aa5500; }
    .c-darkred { background: #8b0000; }
    .c-red { background: #cc0000; }
    .c-darkgreen { background: #006600; }
    .c-green { background: #00aa00; }
    .c-darkcyan { background: #006666; }
    .c-cyan { background: #00aaaa; }
    .c-darkblue { background: #000066; }
    .c-blue { background: #0066cc; }
    .c-darkgray { background: #333333; }
    .c-gray { background: #666666; }

    /* Earth colors */
    .e-blue { background: #0066cc; }
    .e-bluedark { background: #003366; }
    .e-green { background: #00aa00; }
    .e-greendark { background: #006600; }
    .e-white { background: #ffffff; }
    .e-cyan { background: #00aaaa; }
  </style>
</head>
<body>
  <div class="game-container">
    <!-- Stars -->
    <div class="stars" id="stars"></div>

    <!-- Header UI -->
    <div class="header">
      <div class="ui-box">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
          <span class="fuel-label">FUEL</span>
          <span class="fuel-value">6542</span>
        </div>
        <div class="fuel-bar">
          <div class="fuel-segment filled"></div>
          <div class="fuel-segment filled"></div>
          <div class="fuel-segment filled"></div>
          <div class="fuel-segment filled"></div>
          <div class="fuel-segment filled"></div>
          <div class="fuel-segment filled"></div>
          <div class="fuel-segment"></div>
          <div class="fuel-segment"></div>
          <div class="fuel-segment"></div>
          <div class="fuel-segment"></div>
        </div>
      </div>
    </div>

    <!-- Destination -->
    <div class="destination">
      <div class="destination-label">* DESTINATION *</div>
      <div class="destination-name">MARS</div>
    </div>

    <!-- Ship -->
    <div class="ship-container">
      <div class="ship" id="ship"></div>
    </div>

    <!-- State badge -->
    <div class="state-badge">
      <div class="ui-box">
        <span class="state-text">HEALTHY</span>
      </div>
    </div>

    <!-- Earth -->
    <div class="earth" id="earth"></div>

    <!-- Footer -->
    <div class="footer">
      <div class="ui-box stats">
        <div class="stat-row">
          <span class="stat-label">STEPS</span>
          <span class="stat-value">8,234</span>
        </div>
        <div class="stat-row">
          <span class="stat-label">GOAL</span>
          <span class="stat-value" style="color: #00aaaa;">10,000</span>
        </div>
      </div>
      <div class="controls">
        <button class="btn">CYCLE</button>
        <button class="btn red">DMG</button>
        <button class="btn green">FIX</button>
        <button class="btn yellow">STOP</button>
      </div>
    </div>
  </div>

  <script>
    // Ship sprite data (16x24)
    const shipSprite = [
      'TTTTTTTYYUUUUUUT',
      'TTTTTTTYYUUUUUUT',
      'TTTTTTRrrRUUUUUT',
      'TTTTTRrWWrRUUUUT',
      'TTTTRrrrrrrrRUUT',
      'TTTTGgggggggGUUT',
      'TTTCccccccccCUUT',
      'TTTCccccccccCUUT',
      'TTTCccDBBDccCUUT',
      'TTTCccBbbBccCUUT',
      'TTTCccBbbBccCUUT',
      'TTTCccDBBDccCUUT',
      'TTTCccccccccCUUT',
      'TTTCcccGGcccCUUT',
      'TTRCccccccccCRUT',
      'TRrCccccccccCrRT',
      'RrrTCccccccCTrrR',
      'rrTTCccccccCTTrr',
      'TTTTTDDDDDDUtttT',
      'TTTTTDAAAADUtttT',
      'TTTTTTOOOOUUUUUT',
    ];

    // Flame frames
    const flameFrames = [
      ['TTTTTTOYYOUUUUUT', 'TTTTTTTYYUUUUUUT', 'TTTTTTTyyUUUUUUT'],
      ['TTTTTOYWYOYUUUUT', 'TTTTTTOYYOUUUUUT', 'TTTTTTTOOTUUUUUT'],
      ['TTTTTOYWYOYUUUUT', 'TTTTTTYYYYYUUUUT', 'TTTTTTOYYOUUUUUT'],
      ['TTTTTYWWWWYUUUUT', 'TTTTTTOYYYYUUUUT', 'TTTTTTTOOTUUUUUT'],
    ];

    const colorMap = {
      'T': 'c-trans', 'U': 'c-trans',
      'W': 'c-white',
      'Y': 'c-yellow', 'y': 'c-brightyellow',
      'O': 'c-orange', 'o': 'c-darkorange',
      'R': 'c-darkred', 'r': 'c-red',
      'G': 'c-darkgreen', 'g': 'c-green',
      'C': 'c-darkcyan', 'c': 'c-cyan',
      'B': 'c-darkblue', 'b': 'c-blue',
      'D': 'c-darkgray', 'A': 'c-gray',
    };

    // Render ship
    const shipEl = document.getElementById('ship');
    let flameIndex = 0;

    function renderShip() {
      shipEl.innerHTML = '';
      const currentFlame = flameFrames[flameIndex];
      const fullSprite = [...shipSprite, ...currentFlame];

      fullSprite.forEach(row => {
        [...row].forEach(char => {
          const pixel = document.createElement('div');
          pixel.className = `pixel ${colorMap[char] || 'c-trans'}`;
          shipEl.appendChild(pixel);
        });
      });
    }

    renderShip();
    setInterval(() => {
      flameIndex = (flameIndex + 1) % flameFrames.length;
      renderShip();
    }, 100);

    // Generate stars
    const starsEl = document.getElementById('stars');
    const starColors = ['', 'dim', 'yellow', 'cyan', 'pink'];

    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';

      const x = Math.floor(Math.random() * 80) * 4;
      const y = Math.floor(Math.random() * 160) * 4;
      const size = 4 + Math.floor(Math.random() * 2) * 2;

      star.style.left = x + 'px';
      star.style.top = y + 'px';
      star.style.width = size + 'px';
      star.style.height = size + 'px';

      // Random color
      if (Math.random() > 0.8) {
        star.classList.add(starColors[Math.floor(Math.random() * starColors.length)]);
      }

      // Random twinkle
      if (Math.random() > 0.7) {
        star.classList.add('twinkle');
      }

      starsEl.appendChild(star);
    }

    // Generate pixel Earth
    const earthEl = document.getElementById('earth');
    const earthWidth = 80;
    const earthHeight = 16;

    for (let y = 0; y < earthHeight; y++) {
      const row = document.createElement('div');
      row.className = 'earth-row';

      for (let x = 0; x < earthWidth; x++) {
        const pixel = document.createElement('div');
        pixel.className = 'earth-pixel';

        // Curved horizon
        const centerX = earthWidth / 2;
        const distFromCenter = Math.abs(x - centerX) / centerX;
        const curveY = Math.floor(earthHeight * distFromCenter * distFromCenter * 0.5);

        if (y < curveY) {
          pixel.classList.add('c-trans');
        } else if (y === curveY) {
          pixel.classList.add('e-cyan');
        } else {
          // Land or ocean
          const isLand = (x > 8 && x < 20) || (x > 32 && x < 48) || (x > 60 && x < 68);
          const isDeep = y > curveY + (earthHeight - curveY) / 2;

          if (isLand) {
            pixel.classList.add(isDeep ? 'e-greendark' : 'e-green');
          } else {
            pixel.classList.add(isDeep ? 'e-bluedark' : 'e-blue');
          }

          // Clouds
          if (y === curveY + 1 && Math.random() > 0.7) {
            pixel.classList.remove('e-green', 'e-greendark', 'e-blue', 'e-bluedark');
            pixel.classList.add('e-white');
          }
        }

        row.appendChild(pixel);
      }

      earthEl.appendChild(row);
    }
  </script>
</body>
</html>
